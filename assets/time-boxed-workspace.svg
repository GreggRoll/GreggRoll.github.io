<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="660" viewBox="0 0 1050 660" role="img" aria-labelledby="title"><title id="title">Time Boxed web planner preview: priorities, brain dump, and time boxes</title><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="1048" height="658" rx="18" fill="#1a2b20" stroke="#3a4a3d"/><text x="28" y="39" fill="#b4cfac" font-size="10" font-weight="700">YOUR DAILY WORKSPACE</text><text x="28" y="73" fill="#eef4ec" font-size="24" font-weight="600">A day with intention</text><path d="M0 103H1050" stroke="#3a4a3d"/><rect x="880" y="40" width="138" height="31" rx="16" fill="#1a2b20" stroke="#3a4a3d"/><text x="904" y="61" fill="#c0d6ba" font-size="12" font-weight="400">Sample day</text><path d="M465 103V660" stroke="#3a4a3d"/><text x="28" y="145" fill="#eef4ec" font-size="20" font-weight="600">Top priorities</text><text x="28" y="168" fill="#a8bcab" font-size="13" font-weight="400">Start with what matters.</text><text x="28" y="214" fill="#b4cfac" font-size="12" font-weight="400">01</text><text x="58" y="214" fill="#eef4ec" font-size="15" font-weight="400">Make progress on the big idea</text><path d="M28 233H433" stroke="#3a4a3d"/><text x="28" y="272" fill="#b4cfac" font-size="12" font-weight="400">02</text><text x="58" y="272" fill="#eef4ec" font-size="15" font-weight="400">Get outside for a walk</text><path d="M28 291H433" stroke="#3a4a3d"/><text x="28" y="330" fill="#b4cfac" font-size="12" font-weight="400">03</text><text x="58" y="330" fill="#eef4ec" font-size="15" font-weight="400">Leave room to recharge</text><path d="M28 349H433" stroke="#3a4a3d"/><text x="28" y="420" fill="#eef4ec" font-size="20" font-weight="600">Brain dump</text><text x="28" y="443" fill="#a8bcab" font-size="13" font-weight="400">Get it out of your head.</text><rect x="28" y="464" width="405" height="166" rx="8" fill="#14231a" stroke="#3a4a3d"/><text x="43" y="491" fill="#eef4ec" font-size="14" font-weight="400">An idea doesn’t need a perfect plan yet.</text><text x="43" y="518" fill="#eef4ec" font-size="14" font-weight="400"></text><text x="43" y="545" fill="#eef4ec" font-size="14" font-weight="400">Sketch out the next step.</text><text x="43" y="572" fill="#eef4ec" font-size="14" font-weight="400">Pick up something good for dinner.</text><text x="43" y="599" fill="#eef4ec" font-size="14" font-weight="400">Make time for a chapter of my book.</text><text x="497" y="145" fill="#eef4ec" font-size="20" font-weight="600">Time boxes</text><text x="497" y="168" fill="#a8bcab" font-size="13" font-weight="400">A place for your priorities.</text><path d="M497 201H1021" stroke="#3a4a3d"/><text x="511" y="241" fill="#b3c9b4" font-size="12" font-weight="400">9:00 AM</text><text x="606" y="241" fill="#e5eee2" font-size="16" font-weight="400">Coffee &amp; choose today’s priorities</text><rect x="497" y="270" width="524" height="68" rx="0" fill="#304c32" stroke="none"/><rect x="497" y="270" width="3" height="68" rx="0" fill="#bde3a8" stroke="none"/><path d="M497 270H1021" stroke="#3a4a3d"/><text x="511" y="310" fill="#b3c9b4" font-size="12" font-weight="400">10:00 AM</text><text x="606" y="310" fill="#e5eee2" font-size="16" font-weight="400">Deep work · the big idea</text><rect x="497" y="339" width="524" height="68" rx="0" fill="#304c32" stroke="none"/><rect x="497" y="339" width="3" height="68" rx="0" fill="#bde3a8" stroke="none"/><path d="M497 339H1021" stroke="#3a4a3d"/><text x="511" y="379" fill="#b3c9b4" font-size="12" font-weight="400">11:00 AM</text><text x="606" y="379" fill="#e5eee2" font-size="16" font-weight="400">Keep the momentum going</text><path d="M497 408H1021" stroke="#3a4a3d"/><text x="511" y="448" fill="#b3c9b4" font-size="12" font-weight="400">12:00 PM</text><text x="606" y="448" fill="#e5eee2" font-size="16" font-weight="400">Lunch &amp; a walk outside</text><path d="M497 477H1021" stroke="#3a4a3d"/><text x="511" y="517" fill="#b3c9b4" font-size="12" font-weight="400">1:00 PM</text><text x="606" y="517" fill="#e5eee2" font-size="16" font-weight="400">Clear the little things</text><path d="M497 546H1021" stroke="#3a4a3d"/><text x="511" y="586" fill="#b3c9b4" font-size="12" font-weight="400">2:00 PM</text><text x="606" y="586" fill="#a5b8a5" font-size="16" font-weight="400">Leave a little breathing room…</text></g></svg>