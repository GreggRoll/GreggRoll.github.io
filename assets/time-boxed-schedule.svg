<svg xmlns="http://www.w3.org/2000/svg" width="460" height="660" viewBox="0 0 460 660" role="img" aria-labelledby="title"><title id="title">Time Boxed web preview: a complete sample time-boxed schedule</title><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="458" height="658" rx="18" fill="#1a2b20" stroke="#3a4a3d"/><text x="28" y="39" fill="#b4cfac" font-size="10" font-weight="700">YOUR DAILY WORKSPACE</text><text x="28" y="73" fill="#eef4ec" font-size="24" font-weight="600">Give your day structure</text><path d="M0 103H460" stroke="#3a4a3d"/><text x="28" y="146" fill="#eef4ec" font-size="20" font-weight="600">Time boxes</text><text x="28" y="169" fill="#a8bcab" font-size="13" font-weight="400">A place for your priorities.</text><path d="M28 205H432" stroke="#3a4a3d"/><text x="42" y="231" fill="#b3c9b4" font-size="11" font-weight="400">9:00 AM</text><text x="42" y="255" fill="#e5eee2" font-size="15" font-weight="400">Coffee &amp; choose today’s priorities</text><rect x="28" y="274" width="404" height="68" rx="0" fill="#304c32" stroke="none"/><rect x="28" y="274" width="3" height="68" rx="0" fill="#bde3a8" stroke="none"/><path d="M28 274H432" stroke="#3a4a3d"/><text x="42" y="300" fill="#b3c9b4" font-size="11" font-weight="400">10:00 AM</text><text x="42" y="324" fill="#e5eee2" font-size="15" font-weight="400">Deep work · the big idea</text><rect x="28" y="343" width="404" height="68" rx="0" fill="#304c32" stroke="none"/><rect x="28" y="343" width="3" height="68" rx="0" fill="#bde3a8" stroke="none"/><path d="M28 343H432" stroke="#3a4a3d"/><text x="42" y="369" fill="#b3c9b4" font-size="11" font-weight="400">11:00 AM</text><text x="42" y="393" fill="#e5eee2" font-size="15" font-weight="400">Keep the momentum going</text><path d="M28 412H432" stroke="#3a4a3d"/><text x="42" y="438" fill="#b3c9b4" font-size="11" font-weight="400">12:00 PM</text><text x="42" y="462" fill="#e5eee2" font-size="15" font-weight="400">Lunch &amp; a walk outside</text><path d="M28 481H432" stroke="#3a4a3d"/><text x="42" y="507" fill="#b3c9b4" font-size="11" font-weight="400">1:00 PM</text><text x="42" y="531" fill="#e5eee2" font-size="15" font-weight="400">Clear the little things</text><path d="M28 550H432" stroke="#3a4a3d"/><text x="42" y="576" fill="#b3c9b4" font-size="11" font-weight="400">2:00 PM</text><text x="42" y="600" fill="#a5b8a5" font-size="15" font-weight="400">Leave a little breathing room…</text></g></svg>