<svg xmlns="http://www.w3.org/2000/svg" width="460" height="660" viewBox="0 0 460 660" role="img" aria-labelledby="title"><title id="title">Time Boxed web preview: three priorities and a brain dump</title><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="458" height="658" rx="18" fill="#1a2b20" stroke="#3a4a3d"/><text x="28" y="39" fill="#b4cfac" font-size="10" font-weight="700">YOUR DAILY WORKSPACE</text><text x="28" y="73" fill="#eef4ec" font-size="24" font-weight="600">A little room to think</text><path d="M0 103H460" stroke="#3a4a3d"/><text x="28" y="146" fill="#eef4ec" font-size="20" font-weight="600">Top priorities</text><text x="28" y="169" fill="#a8bcab" font-size="13" font-weight="400">Start with what matters.</text><text x="28" y="215" fill="#b4cfac" font-size="12" font-weight="400">01</text><text x="58" y="215" fill="#eef4ec" font-size="15" font-weight="400">Make progress on the big idea</text><path d="M28 234H432" stroke="#3a4a3d"/><text x="28" y="273" fill="#b4cfac" font-size="12" font-weight="400">02</text><text x="58" y="273" fill="#eef4ec" font-size="15" font-weight="400">Get outside for a walk</text><path d="M28 292H432" stroke="#3a4a3d"/><text x="28" y="331" fill="#b4cfac" font-size="12" font-weight="400">03</text><text x="58" y="331" fill="#eef4ec" font-size="15" font-weight="400">Leave room to recharge</text><path d="M28 350H432" stroke="#3a4a3d"/><text x="28" y="407" fill="#eef4ec" font-size="20" font-weight="600">Brain dump</text><text x="28" y="430" fill="#a8bcab" font-size="13" font-weight="400">Get it out of your head.</text><rect x="28" y="451" width="404" height="180" rx="8" fill="#14231a" stroke="#3a4a3d"/><text x="43" y="479" fill="#eef4ec" font-size="15" font-weight="400">An idea doesn’t need a perfect plan yet.</text><text x="43" y="507" fill="#eef4ec" font-size="15" font-weight="400"></text><text x="43" y="535" fill="#eef4ec" font-size="15" font-weight="400">Sketch out the next step.</text><text x="43" y="563" fill="#eef4ec" font-size="15" font-weight="400">Pick up something good for dinner.</text><text x="43" y="591" fill="#eef4ec" font-size="15" font-weight="400">Make time for a chapter of my book.</text></g></svg>